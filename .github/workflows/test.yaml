name: Test

on:
  push:
    branches:
      - "fix-cve"

jobs:
  Test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.24.1"

      - name: Run tests
        run: |
          go test

      - name: Run go vet
        run: |
          go vet -mod=readonly  . ./cmd

      - uses: dominikh/staticcheck-action@v1.2.0
        with:
          version: "2022.1.1" 
          install-go: false
